type: object
additionalProperties: false
properties:
  general:
    type: object
    additionalProperties: true
    description: |
      Configure general instrumentation options that may apply to multiple languages and instrumentations.
      Instrumentation may merge general config options with the language specific configuration at .instrumentation.<language>.

      The schema for this section is owned by the OpenTelemetry Semantic Conventions project and published as opentelemetry_instrumentation_configuration.json.
      See https://github.com/open-telemetry/semantic-conventions.
    defaultBehavior: instrumentation defaults are used
  cpp:
    $ref: "#/$defs/ExperimentalLanguageSpecificInstrumentation"
    description: Configure C++ language-specific instrumentation libraries.
    defaultBehavior: instrumentation defaults are used
  dotnet:
    $ref: "#/$defs/ExperimentalLanguageSpecificInstrumentation"
    description: |
      Configure .NET language-specific instrumentation libraries.
      Each entry's key identifies a particular instrumentation library. The corresponding value configures it.
    defaultBehavior: instrumentation defaults are used
  erlang:
    $ref: "#/$defs/ExperimentalLanguageSpecificInstrumentation"
